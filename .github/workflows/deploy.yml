name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      # BrowserRouter uses client-side routing, so GitHub Pages must serve
      # index.html for any path it doesn't recognize as a static file
      # (e.g. /projects/chronix) — otherwise a direct load or refresh 404s.
      - name: Add SPA fallback for GitHub Pages
        run: cp web/build/index.html web/build/404.html

      # GitHub Pages serves this repo straight from main's root, so the
      # build output has to live there too. Copy it in without deleting
      # anything: a page added only at the root used to vanish on the next
      # deploy (it did for the Aquatick privacy policy). Only assets/ is
      # cleaned, because its file names carry a hash and stale bundles would
      # otherwise pile up. Keep static pages in web/public.
      - name: Publish build to repo root
        run: |
          rsync -a \
            --exclude='/.git' \
            --exclude='/.github' \
            --exclude='/.idea' \
            --exclude='/web' \
            --exclude='/README.md' \
            --exclude='/.gitignore' \
            web/build/ ./
          rsync -a --delete web/build/assets/ ./assets/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Publish build from ${{ github.sha }}"
            git push
          fi
